name: GitHub Pages

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Determine Pages base path
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-$(echo ${GITHUB_REF#refs/heads/})}"
          if [[ "${BRANCH_NAME}" == "main" ]]; then
            echo "PAGE_BASE_PATH=/" >> $GITHUB_ENV
          else
            SAFE_NAME=$(echo "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's@[^a-z0-9._-]@-@g')
            echo "PAGE_BASE_PATH=/${SAFE_NAME}/" >> $GITHUB_ENV
          fi
          echo "Branch preview path: ${PAGE_BASE_PATH}"

      - name: Build GitHub Pages site
        run: |
          cd apps/web
          VITE_BASE_PATH="${PAGE_BASE_PATH}" pnpm build:pages
          cd ../..

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: Deploy static site
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview:
    name: Deploy static preview site
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
